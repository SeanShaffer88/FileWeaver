name: CI

# The contributor gate from the README: format, lint, and test.
# (A Windows release build is not part of this workflow yet; see the README's
# verification notes.)
on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Slint's winit/femtovg backend and the accessibility feature link
      # against these system libraries on Linux.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-xcb-dev libgl1-mesa-dev libdbus-1-dev

      - name: Show toolchain versions
        run: rustc --version && cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Diagnostics are echoed as workflow annotations so a failing run explains
      # itself in the pull request's Checks tab without downloading logs.
      - name: Clippy (warnings are errors)
        run: |
          set +e
          cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^(error|warning)" clippy.txt | head -40 | while IFS= read -r line; do
              echo "::error title=clippy::$line"
            done
            grep -E "^\./|^src/" clippy.txt | head -40 | while IFS= read -r line; do
              echo "::error title=clippy detail::$line"
            done
            exit "$status"
          fi

      - name: Tests
        run: |
          set +e
          cargo test 2>&1 | tee tests.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^(error|test .* FAILED|failures:|---- )|panicked at" tests.txt | head -40 \
              | while IFS= read -r line; do echo "::error title=test::$line"; done
            exit "$status"
          fi
