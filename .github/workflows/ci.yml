name: CI

# The contributor gate from the README: format, lint, and test.
# (A Windows release build is not part of this workflow yet; see the README's
# verification notes.)
on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Slint's winit/femtovg backend and the accessibility feature link
      # against these system libraries on Linux.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-xcb-dev libgl1-mesa-dev libdbus-1-dev

      - name: Show toolchain versions
        run: rustc --version && cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
