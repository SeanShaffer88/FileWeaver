[package]
name = "fileweaver"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A local-first Windows file organization and batch-renaming studio"
license = "GPL-2.0-only"
repository = "https://github.com/SeanShaffer88/FileWeaver"
build = "build.rs"

[lib]
name = "fileweaver_core"
path = "src/lib.rs"

[[bin]]
name = "fileweaver"
path = "src/main.rs"

[dependencies]
kamadak-exif = "0.6"
regex = "1.12"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "accessibility", "compat-1-2"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "local-offset", "serde"] }
walkdir = "2.5"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
